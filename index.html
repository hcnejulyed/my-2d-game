<!DOCTYPE html>
<html>
<head>
    <title>SPACE SHOOTER</title>
    <style>
        body { background: #050514; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { border: 2px solid #00dcff; background: #050514; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = 800, HEIGHT = 600;
const BLACK = '#050514';
const WHITE = '#ffffff';
const CYAN = '#00dcff';
const YELLOW = '#ffe600';
const RED = '#ff4650';
const PURPLE = '#b450ff';
const GREEN = '#50ff96';

let state = "MENU";
let keys = {};
let highScore = 0;
let stars = [];
let bullets = [];
let enemies = [];
let particles = [];

let playerX = WIDTH / 2;
let playerY = 75;
let score = 0;
let lives = 3;
let level = 1;
let shootTimer = 0;
let spawnTimer = 0;
let lastTime = 0;

function createStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * WIDTH,
            y: Math.random() * HEIGHT,
            speed: 20 + Math.random() * 80,
            size: 1 + Math.random() * 2
        });
    }
}

function resetGame() {
    playerX = WIDTH / 2;
    playerY = 75;
    bullets = [];
    enemies = [];
    particles = [];
    score = 0;
    lives = 3;
    level = 1;
    shootTimer = 0;
    spawnTimer = 0;
}

function createEnemy() {
    const colors = [RED, PURPLE, GREEN];
    enemies.push({
        x: 25 + Math.random() * (WIDTH - 50),
        y: HEIGHT + 20,
        radius: 14 + Math.random() * 8,
        speed: 70 + Math.random() * 40 + level * 8,
        color: colors[Math.floor(Math.random() * colors.length)]
    });
}

function createParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 40 + Math.random() * 120;
        particles.push({
            x: x, y: y,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            life: 0.5,
            color: color
        });
    }
}

document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (state === "MENU" && e.key === "Enter") {
        resetGame();
        state = "PLAYING";
    }
    if (state === "GAME_OVER") {
        if (e.key === "r") { resetGame(); state = "PLAYING"; }
        if (e.key === "Enter") { state = "MENU"; }
    }
    if (state === "PLAYING" && e.key === "p") state = "PAUSED";
    else if (state === "PAUSED" && (e.key === "p" || e.key === "Enter")) state = "PLAYING";
});

document.addEventListener('keyup', e => keys[e.key] = false);

function distance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
}

function gameLoop(timestamp) {
    let deltaTime = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (deltaTime > 0.1) deltaTime = 0.016;

    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Stars
    stars.forEach(star => {
        star.y -= star.speed * deltaTime;
        if (star.y < 0) { star.y = HEIGHT; star.x = Math.random() * WIDTH; }
        ctx.fillStyle = WHITE;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });

    if (state === "MENU") {
        ctx.fillStyle = CYAN; ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("SPACE SHOOTER", WIDTH/2, 390);
        ctx.fillStyle = WHITE; ctx.font = '18px Arial';
        ctx.fillText("Protect your spaceship!", WIDTH/2, 330);
        ctx.fillStyle = YELLOW; ctx.font = '22px Arial';
        ctx.fillText("Press ENTER to Start", WIDTH/2, 250);
        ctx.fillStyle = WHITE; ctx.font = '16px Arial';
        ctx.fillText("Arrow Keys: Move | SPACE: Shoot", WIDTH/2, 190);
        ctx.fillStyle = GREEN; ctx.font = '18px Arial';
        ctx.fillText("Best Score: " + highScore, WIDTH/2, 145);
        requestAnimationFrame(gameLoop);
        return;
    }

    if (state === "PAUSED") {
        ctx.fillStyle = YELLOW; ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("PAUSED", WIDTH/2, 330);
        ctx.fillStyle = WHITE; ctx.font = '20px Arial';
        ctx.fillText("Press P to Resume", WIDTH/2, 270);
        requestAnimationFrame(gameLoop);
        return;
    }

    if (state === "GAME_OVER") {
        ctx.fillStyle = RED; ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", WIDTH/2, 350);
        ctx.fillStyle = WHITE; ctx.font = '22px Arial';
        ctx.fillText("Final Score: " + score, WIDTH/2, 290);
        ctx.fillStyle = GREEN; ctx.font = '18px Arial';
        ctx.fillText("Best Score: " + highScore, WIDTH/2, 250);
        ctx.fillStyle = YELLOW; ctx.font = '20px Arial';
        ctx.fillText("Press R to Play Again", WIDTH/2, 195);
        ctx.fillStyle = WHITE; ctx.font = '16px Arial';
        ctx.fillText("Press ENTER for Main Menu", WIDTH/2, 155);
        requestAnimationFrame(gameLoop);
        return;
    }

    if (state !== "PLAYING") {
        requestAnimationFrame(gameLoop);
        return;
    }

    shootTimer -= deltaTime;
    spawnTimer += deltaTime;
    level = 1 + Math.floor(score / 100);

    // Player Movement
    let dx = 0, dy = 0;
    if (keys['ArrowLeft']) dx -= 1;
    if (keys['ArrowRight']) dx += 1;
    if (keys['ArrowUp']) dy += 1;
    if (keys['ArrowDown']) dy -= 1;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    playerX += dx * 300 * deltaTime;
    playerY += dy * 300 * deltaTime;
    playerX = Math.max(25, Math.min(WIDTH - 25, playerX));
    playerY = Math.max(30, Math.min(HEIGHT - 30, playerY));

    // Shoot
    if (keys[' '] && shootTimer <= 0) {
        bullets.push({ x: playerX, y: playerY + 25 });
        shootTimer = 0.22;
    }

    // Spawn Enemies
    const spawnDelay = Math.max(0.35, 1.1 - level * 0.08);
    if (spawnTimer >= spawnDelay) {
        createEnemy();
        spawnTimer = 0;
    }

    // Update Bullets
    bullets = bullets.filter(b => {
        b.y += 500 * deltaTime;
        return b.y > 0 && b.y < HEIGHT + 20;
    });

    // Update Particles
    particles = particles.filter(p => {
        p.x += p.dx * deltaTime;
        p.y += p.dy * deltaTime;
        p.life -= deltaTime;
        return p.life > 0;
    });

    // Update Enemies & Collisions
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y -= e.speed * deltaTime;

        if (e.y < -20) {
            enemies.splice(i, 1);
            lives--;
            if (lives <= 0) {
                state = "GAME_OVER";
                if (score > highScore) highScore = score;
                break;
            }
            continue;
        }

        // Player hit
        if (distance(e.x, e.y, playerX, playerY) < e.radius + 17) {
            createParticles(e.x, e.y, e.color);
            enemies.splice(i, 1);
            lives--;
            if (lives <= 0) {
                state = "GAME_OVER";
                if (score > highScore) highScore = score;
                break;
            }
            continue;
        }

        // Bullet hit
        for (let j = bullets.length - 1; j >= 0; j--) {
            if (distance(bullets[j].x, bullets[j].y, e.x, e.y) < e.radius + 😎 {
                createParticles(e.x, e.y, e.color);
                enemies.splice(i, 1);
                bullets.splice(j, 1);
                score += 10;
                break;
            }
        }
    }

    // Draw Player
    ctx.fillStyle = CYAN;
    ctx.beginPath();
    ctx.moveTo(playerX, playerY + 30);
    ctx.lineTo(playerX - 25, playerY - 20);
    ctx.lineTo(playerX + 25, playerY - 20);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.arc(playerX, playerY, 7, 0, Math.PI * 2);
    ctx.fill();

    // Draw Bullets
    ctx.fillStyle = YELLOW;
    bullets.forEach(b => {
        ctx.fillRect(b.x - 3, b.y, 6, 18);
    });

    // Draw Enemies
    enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = WHITE;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
    });

    // Draw Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life * 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;

    // UI
    ctx.fillStyle = WHITE; ctx.font = '18px Arial';
    ctx.textAlign = 'left';
    ctx.fillText("Score: " + score, 20, HEIGHT - 20);
    ctx.textAlign = 'right';
    ctx.fillText("Lives: " + lives, WIDTH - 20, HEIGHT - 20);
    ctx.textAlign = 'center';
    ctx.fillStyle = CYAN;
    ctx.fillText("Level: " + level, WIDTH/2, HEIGHT - 20);

    requestAnimationFrame(gameLoop);
}

createStars();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
